<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ระบบบริหารจัดการเบิกจ่ายค่าใช้จ่ายและใบเสร็จ (Expense Reimbursement & Receipt Audit) สำหรับพนักงาน ฝ่ายการเงิน และหัวหน้างาน">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💸</text></svg>">
  <title>เข้าสู่ระบบ | ระบบบริหารจัดการเบิกจ่ายค่าใช้จ่ายและใบเสร็จ</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .login-container {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 2rem;
    }
    .login-card {
      width: 100%;
      max-width: 460px;
      background: rgba(19, 27, 46, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-lg);
      padding: 2.75rem;
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      position: relative;
    }
    .login-logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(168, 85, 247, 0.2));
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 1.25rem;
      box-shadow: 0 8px 25px rgba(56, 189, 248, 0.2);
    }
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-header h1 {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 0.4rem;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }
    .login-header p {
      color: var(--text-muted);
      font-size: 0.88rem;
    }
    .demo-accounts {
      margin-top: 1.75rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border-color);
    }
    .demo-title {
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 0.85rem;
      text-align: center;
    }
    .demo-badges {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.6rem;
    }
    .demo-btn {
      padding: 0.6rem 0.75rem;
      font-size: 0.78rem;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
    }
    .demo-btn:hover {
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateY(-1px);
    }
    @media (max-width: 480px) {
      .login-container {
        padding: 1rem 0.75rem;
      }
      .login-card {
        padding: 1.75rem 1.25rem;
      }
      .login-header h1 {
        font-size: 1.35rem;
      }
      .demo-badges {
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem;
      }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div style="position: absolute; top: 1.25rem; right: 1.25rem;">
        <button type="button" class="theme-toggle-btn" onclick="toggleTheme()" title="สลับโหมด Dark / White" aria-label="สลับโหมด Dark / White">🌙</button>
      </div>
      <div class="login-header">
        <div class="login-logo">💸</div>
        <h1>ระบบเบิกจ่ายค่าใช้จ่าย</h1>
        <p>Expense Reimbursement & Receipt Audit</p>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">ชื่อผู้ใช้งาน (Username)</label>
          <input type="text" id="username" class="form-control" placeholder="เช่น admin, manager, finance, employee" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label">รหัสผ่าน (Password)</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; margin-top: 0.6rem; padding: 0.8rem;">
          เข้าสู่ระบบ ➔
        </button>
      </form>

      <div class="demo-accounts">
        <div class="demo-title">⚡ บัญชีสำหรับทดสอบด่วน (รหัสผ่าน: Password123!)</div>
        <div class="demo-badges">
          <button type="button" class="demo-btn" onclick="fillAccount('admin')">👑 Admin</button>
          <button type="button" class="demo-btn" onclick="fillAccount('manager')">👔 Manager</button>
          <button type="button" class="demo-btn" onclick="fillAccount('finance')">💳 Finance</button>
          <button type="button" class="demo-btn" onclick="fillAccount('employee')">👤 Employee</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="/js/api.js"></script>
  <script>
    function fillAccount(roleUser) {
      document.getElementById('username').value = roleUser;
      document.getElementById('password').value = 'Password123!';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.innerText = 'กำลังตรวจสอบ...';

      try {
        const res = await api.post('/api/auth/login', { username, password });
        showToast('เข้าสู่ระบบสำเร็จ กำลังพาไปหน้าหลัก...', 'success');
        setTimeout(() => {
          window.location.href = '/app';
        }, 600);
      } catch (err) {
        showToast(err.message, 'error');
        submitBtn.disabled = false;
        submitBtn.innerText = 'เข้าสู่ระบบ';
      }
    }
</script>
</body>
</html>
